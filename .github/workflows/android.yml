name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', 'tide-stations.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 更新インストールできるよう署名を固定する。無ければ初回のみ生成してコミットする
      - name: Ensure debug keystore
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -keystore android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=TideWidget Debug"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add android/debug.keystore
            git commit -m "Add fixed debug keystore for Android app (PWA + widget)"
            git push
          fi

      - name: Copy tide stations
        run: |
          mkdir -p android/app/src/main/assets
          cp tide-stations.json android/app/src/main/assets/

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tide-widget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Android widget (latest)" --notes "Debug build of commit ${GITHUB_SHA::7}" --prerelease

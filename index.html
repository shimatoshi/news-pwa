<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ニュース & 天気</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#146853">
<style>
/* Reading-first interface. Data, storage and interaction logic remain in app.js. */
:root { --ink:#192b37; --muted:#526674; --paper:#fff; --canvas:#f3f6f7; --line:#dce5e9; --accent:#146853; --soft:#e8f3ee; --blue:#165d89; --chrome-height:150px; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',Meiryo,sans-serif; background:var(--canvas); color:var(--ink); min-height:100vh; line-height:1.65; padding-bottom:64px; }
button,input,textarea { font:inherit; }
button { cursor:pointer; }
a { color:var(--accent); }
[hidden] { display:none !important; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.app-chrome { position:sticky; top:0; z-index:100; background:var(--paper); border-bottom:1px solid var(--line); }
header { max-width:1024px; margin:auto; padding:22px 28px 16px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.brand-kicker { font-size:11px; font-weight:750; letter-spacing:.18em; color:var(--accent); margin-bottom:3px; }
header h1 { font-size:23px; line-height:1.35; letter-spacing:.02em; }
.status { color:var(--muted); font-size:12px; margin-top:7px; }
.status.online::before { content:'● '; color:var(--accent); }
.status.offline::before { content:'● '; color:#a25111; }
.tabs { max-width:1024px; margin:auto; display:flex; gap:8px; padding:0 28px; }
.tab { display:flex; justify-content:center; align-items:center; gap:9px; border:0; border-bottom:3px solid transparent; background:transparent; color:var(--muted); padding:14px 24px; font-size:14px; font-weight:700; min-height:52px; transition:background .15s; }
.tab svg { width:19px; height:19px; flex-shrink:0; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); background:linear-gradient(0deg,var(--soft),transparent); }
.tab:hover { background:var(--soft); }
.content { max-width:1024px; margin:0 auto; padding:32px 28px; }
#panel-news,#panel-weather,#panel-tide { display:none; }
#panel-news.active,#panel-weather.active,#panel-tide.active { display:block; }
.panel-intro { margin-bottom:24px; }
.panel-intro .eyebrow { font-size:11px; color:var(--accent); font-weight:750; letter-spacing:.14em; margin-bottom:5px; }
.panel-intro h2 { font-size:28px; line-height:1.4; letter-spacing:.02em; }
.panel-intro p { font-size:14px; color:var(--muted); margin-top:6px; }
.news-tools { margin-bottom:20px; }
.news-tools-row { display:flex; gap:8px; align-items:center; }
.add-site-btn,.geo-btn,.text-action,.reader-back { border:1px solid var(--line); background:var(--paper); color:var(--accent); border-radius:8px; min-height:44px; padding:9px 15px; font-size:14px; font-weight:650; }
.add-site-btn:hover,.geo-btn:hover,.text-action:hover,.reader-back:hover { background:var(--soft); border-color:var(--accent); }
.feed-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.feed-chip { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--paper); border-radius:24px; padding:4px 5px 4px 14px; color:var(--muted); font-size:13px; }
.feed-del { width:32px; height:32px; border:0; border-radius:50%; background:var(--canvas); color:var(--muted); }
.feed-del:hover { color:#ad3030; background:#fff0ef; }
.site-form { display:none; margin-top:14px; max-width:620px; padding:24px; background:var(--paper); border:1px solid var(--line); border-radius:12px; }
.site-form.open { display:block; }
.site-form label { display:block; font-size:14px; font-weight:650; margin:12px 0 6px; }
.site-form input { width:100%; padding:12px; min-height:48px; border:1px solid #a7bac4; border-radius:7px; background:var(--paper); color:var(--ink); font-size:16px; margin-bottom:6px; }
.site-form .sf-hint { font-size:13px; color:var(--muted); line-height:1.8; }
.site-form-row { display:flex; gap:10px; margin-top:12px; }
.site-form button { border:1px solid var(--line); border-radius:7px; min-height:44px; padding:9px 20px; font-weight:650; }
.sf-add { background:var(--accent); color:white; }
.sf-cancel { background:var(--canvas); color:var(--muted); }
.form-error { color:#a33124; font-size:14px; }
.data-state,.notice { padding:14px 18px; border:1px solid var(--line); border-left:3px solid #9aafba; border-radius:8px; background:#edf2f4; color:var(--muted); font-size:13px; line-height:1.85; margin-bottom:24px; overflow-wrap:anywhere; }
.data-state:empty { display:none; }
.data-state .text-action { display:block; margin-top:10px; }
.notice { max-width:968px; margin:16px auto; }
#progress { color:var(--accent); background:var(--soft); text-align:center; padding:10px 20px; font-size:13px; }
.empty,.tide-empty { background:var(--paper); border:1px dashed #bdcdd5; border-radius:12px; padding:48px 24px; text-align:center; color:var(--muted); font-size:15px; line-height:2; }
.tide-empty .geo-btn { margin-top:18px; }
.news-category { margin-bottom:32px; }
.cat-header { display:flex; align-items:center; gap:12px; padding-bottom:12px; margin-bottom:0; border-bottom:2px solid var(--ink); }
.cat-header h2 { font-size:18px; font-weight:750; }
.cat-header .count,.area-count { color:var(--muted); background:#eaf0f3; font-size:12px; padding:2px 9px; border-radius:20px; white-space:nowrap; }
.news-item { background:var(--paper); border-bottom:1px solid var(--line); }
.news-item:first-of-type { border-radius:10px 10px 0 0; }
.news-item:last-child { border-radius:0 0 10px 10px; }
.news-header { display:flex; width:100%; gap:24px; align-items:center; padding:23px 22px; text-align:left; border:0; background:transparent; color:inherit; }
.news-header:hover { background:#edf5f1; }
.news-main { flex:1; min-width:0; }
.news-title { display:block; font-size:18px; font-weight:650; line-height:1.8; margin-bottom:10px; overflow-wrap:anywhere; }
.news-item .meta { display:block; color:var(--muted); font-size:12px; line-height:1.7; }
.news-thumb { width:112px; height:84px; flex-shrink:0; object-fit:cover; border-radius:7px; background:var(--canvas); }
.offline-badge { margin-left:8px; font-size:12px; }
.news-body { display:none; padding:0 22px 22px; }
.news-item.open .news-body { display:block; }
.news-body p { font-size:15px; line-height:1.9; color:var(--muted); }
.read-more { display:inline-block; margin-top:18px; padding:10px 0; font-size:14px; font-weight:650; text-underline-offset:4px; }
.reader { position:fixed; inset:0; background:var(--paper); z-index:200; overflow-y:auto; overscroll-behavior:contain; transform:translateX(100%); }
.reader.open { transform:translateX(0); }
.reader-bar { position:sticky; top:0; z-index:1; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); padding:12px max(20px,calc((100vw - 760px)/2)); }
.reader-content { max-width:760px; margin:auto; padding:36px 28px 80px; overflow-wrap:anywhere; }
.reader-title { font-size:28px; line-height:1.7; font-weight:750; margin-bottom:16px; }
.reader-meta { color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:28px; }
.reader-text { font-size:17px; line-height:2.1; }
.reader-text p { color:var(--ink); margin-bottom:24px; }
.reader-text img { max-width:100%; height:auto; }
.reader-text .reader-note { font-size:14px; background:var(--soft); color:var(--accent); border-radius:8px; padding:14px; }
.reader-hero { width:100%; max-height:360px; object-fit:cover; border-radius:10px; margin-bottom:24px; }
.geo-card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:24px; }
.geo-empty,.geo-head { display:flex; justify-content:space-between; gap:16px; align-items:center; font-size:14px; color:var(--muted); }
.geo-head { margin-bottom:20px; }
.geo-name,.point-name,.sub-name { color:var(--blue); font-size:16px; font-weight:700; }
.geo-refresh { width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:var(--canvas); color:var(--accent); font-size:22px; }
.geo-now { display:flex; align-items:center; gap:18px; margin-bottom:24px; }
.geo-icon { font-size:48px; }
.geo-temp { font-size:48px; font-weight:700; line-height:1; }
.geo-detail { font-size:13px; color:var(--muted); line-height:1.8; }
.geo-detail div:first-child { color:var(--ink); font-size:16px; font-weight:650; }
.geo-updated,.data-date { color:var(--muted); font-size:12px; line-height:1.8; margin:12px 0; }
.geo-updated { text-align:right; }
.weather-area { margin-bottom:12px; background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.area-header { display:flex; width:100%; align-items:center; gap:12px; min-height:62px; padding:16px 20px; border:0; background:var(--paper); color:var(--ink); text-align:left; }
.area-header:hover { background:var(--soft); }
.area-title { flex:1; font-size:16px; font-weight:700; }
.area-arrow { font-size:10px; color:var(--accent); transition:transform .15s; }
.weather-area.open .area-arrow { transform:rotate(90deg); }
.weather-area.open>.area-header { background:var(--soft); }
.area-body { display:none; padding:12px; }
.weather-area.open>.area-body { display:block; }
.weather-pref { margin-bottom:8px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.pref-header { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; min-height:52px; padding:12px 16px; background:var(--paper); color:var(--ink); border:0; text-align:left; font-size:15px; font-weight:650; }
.pref-header[aria-expanded='true'] { background:var(--canvas); }
.pref-summary { color:var(--muted); font-size:13px; font-weight:400; }
.pref-body { display:none; padding:4px 18px 20px; }
.weather-pref.open>.pref-body { display:block; }
.sub-area { background:var(--canvas); border-radius:8px; padding:16px; margin:16px 0; }
.sub-name { margin-bottom:10px; }
.today-item { padding:4px 0; font-size:14px; line-height:1.8; }
.today-label,.pt-name { color:var(--muted); margin-right:8px; }
.temp-row { display:flex; flex-wrap:wrap; gap:12px; }
.temp-pt { font-size:14px; }
.hi,.hourly-temp { color:#b5412e; }
.lo { color:var(--blue); }
.week-area-name,.point-noweek,.point-now { font-size:13px; color:var(--muted); }
.point-now { display:block; font-weight:400; margin-top:4px; }
.point-week { margin:24px 0 8px; }
.point-name { margin-bottom:12px; }
.week-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:8px; }
.day-card { background:var(--canvas); border:1px solid var(--line); border-radius:8px; padding:14px 8px; text-align:center; }
.day-name { color:var(--ink); font-size:13px; font-weight:650; }
.day-name.sat { color:var(--blue); }
.day-name.sun { color:#b5412e; }
.weather-icon { font-size:28px; margin:8px 0; }
.weather-text { color:var(--muted); font-size:12px; margin-bottom:8px; }
.day-card .temp { font-size:12px; }
.day-card .temp span { display:block; }
.pop { font-size:13px; color:var(--blue); margin-top:6px; }
.hourly-pops { margin:20px 0; }
.hourly-label { color:var(--muted); font-size:13px; margin-bottom:12px; }
.hourly-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(48px,1fr)); gap:8px; }
.hourly-cell { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-height:114px; padding:8px 4px; background:var(--canvas); border-radius:6px; }
.hourly-time { color:var(--muted); font-size:12px; margin-bottom:8px; }
.hourly-gauge { width:65%; min-height:2px; max-height:36px; border-radius:3px 3px 0 0; }
.hourly-val,.hourly-mm,.hourly-temp { font-size:12px; margin-top:4px; }
.hourly-val { color:var(--ink); }
.hourly-mm { color:var(--blue); min-height:1em; }
.warn-headline { padding:14px; font-size:14px; border-left:4px solid; border-radius:6px; margin-bottom:16px; }
.warn-badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.warn-badge { font-size:12px; font-weight:650; border-radius:5px; padding:4px 8px; }
.warn-special { background:#fbe7ed; color:#9b153b; border-color:#9b153b; }
.warn-warning { background:#fff0e4; color:#944000; border-color:#944000; }
.warn-advisory { background:#fff6d7; color:#705800; border-color:#a17b00; }
.tide-page-stn { font-size:16px; color:var(--muted); padding:18px 20px; background:var(--soft); border-radius:8px; margin-bottom:24px; }
.tide-page-stn b { color:var(--accent); }
.tide-day { margin-bottom:24px; }
.tide-day-head { font-size:18px; font-weight:700; margin-bottom:10px; }
.tide-day-dow { font-size:13px; color:var(--muted); margin-left:10px; font-weight:400; }
.tide-card { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:22px; margin:12px 0; }
.tide-head { color:var(--blue); font-size:16px; font-weight:700; margin-bottom:14px; }
.tide-stn { color:var(--muted); font-size:13px; font-weight:400; margin-left:8px; }
.tide-rows { display:flex; flex-direction:column; gap:12px; }
.tide-row { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
.tide-k { font-size:12px; font-weight:700; border-radius:5px; padding:4px 10px; white-space:nowrap; }
.tide-k.high { color:var(--blue); background:#e8f2f9; }
.tide-k.low { color:#915400; background:#fff1de; }
.tide-ev { font-size:15px; color:var(--muted); }
.tide-ev b { color:var(--ink); font-variant-numeric:tabular-nums; }
.tide-none { color:var(--muted); }
.tide-spark { position:relative; display:flex; align-items:flex-end; gap:3px; height:100px; margin:32px 0 8px; border-bottom:1px solid #97b3c3; background:repeating-linear-gradient(to top,transparent 0,transparent 24px,#edf2f4 24px,#edf2f4 25px); }
.tide-bar { flex:1; min-height:2px; background:#3b83a0; border-radius:3px 3px 0 0; }
.tide-bar.now { position:relative; background:var(--accent); }
.tide-bar.now::before { content:'現在'; position:absolute; bottom:100%; left:50%; transform:translateX(-50%); color:var(--accent); font-size:12px; white-space:nowrap; }
.tide-axis { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
.tide-data summary { padding:14px 0 0; cursor:pointer; color:var(--blue); font-size:13px; }
.tide-data table { width:100%; border-collapse:collapse; font-size:14px; margin-top:12px; }
.tide-data caption { text-align:left; color:var(--muted); font-size:12px; padding-bottom:8px; }
.tide-data th,.tide-data td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
.tide-data tr.current { background:var(--soft); }
.tide-data tr.current th::after { content:'（現在の時間帯）'; font-size:12px; }
.tide-browser-head { font-size:16px; font-weight:700; padding-top:24px; margin:28px 0 14px; border-top:1px solid var(--line); }
.tide-stn-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
.tide-stn-btn { border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--blue); padding:12px 8px; min-height:48px; font-size:14px; overflow-wrap:anywhere; }
.tide-stn-btn:hover,.tide-stn-btn:active { background:var(--soft); border-color:var(--accent); }
.btn-refresh { flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:white; font-size:14px; font-weight:650; }
.refresh-icon { display:inline-block; font-size:22px; line-height:1; }
.btn-refresh.loading .refresh-icon { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
button:disabled { opacity:.65; cursor:wait; }
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible { outline:3px solid #278bb5; outline-offset:3px; }
#tide-detail,.weather-pref,.news-item { scroll-margin-top:calc(var(--chrome-height) + 16px); }
@media (max-width:600px) {
 header { padding:16px 18px 12px; gap:10px; align-items:flex-start; }
 header h1 { font-size:20px; }
 .brand-kicker { font-size:10px; }
 .status { font-size:11px; max-width:220px; }
 .btn-refresh { padding:9px 12px; margin-top:5px; }
 .tabs { padding:0 12px; gap:4px; }
 .tab { flex:1; padding:13px 6px; font-size:13px; gap:6px; }
 .tab svg { width:17px; height:17px; }
 .content { padding:24px 16px; }
 .panel-intro { margin-bottom:20px; }
 .panel-intro h2 { font-size:24px; }
 .panel-intro p { font-size:13px; }
 .news-header { padding:18px 14px; gap:14px; align-items:flex-start; }
 .news-title { font-size:16px; line-height:1.8; margin-bottom:8px; }
 .news-thumb { width:80px; height:80px; }
 .news-item .meta { font-size:12px; }
 .data-state { padding:12px 14px; }
 .geo-card,.tide-card { padding:18px 14px; }
 .geo-empty { flex-wrap:wrap; }
 .geo-temp { font-size:40px; }
 .geo-icon { font-size:36px; }
 .geo-now { gap:12px; flex-wrap:wrap; }
 .area-header { padding:15px; }
 .area-body { padding:8px; }
 .pref-body { padding:4px 12px 16px; }
 .pref-header { flex-wrap:wrap; padding:12px; }
 .week-grid { grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); }
 .site-form { padding:18px; }
 .reader-content { padding:24px 20px 64px; }
 .reader-title { font-size:23px; }
 .reader-text { font-size:16px; line-height:2; }
 .notice { margin:12px 16px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="app-chrome">
<header>
  <div class="brand"><div class="brand-kicker">DAILY / NEWS · WEATHER · TIDE</div><h1>ニュース & 天気</h1>
  <div class="status" id="status">確認中...</div></div>
  <button class="btn-refresh" id="btn-refresh" title="更新" aria-label="ニュースと天気を更新"><span class="refresh-icon" aria-hidden="true">↻</span><span>更新</span></button>
</header>
<div class="tabs" role="tablist" aria-label="表示する情報">
  <button id="tab-news" class="tab active" role="tab" aria-selected="true" aria-controls="panel-news" data-panel="news"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h3M8 18h8"/></svg>ニュース</button>
  <button id="tab-weather" class="tab" role="tab" aria-selected="false" aria-controls="panel-weather" tabindex="-1" data-panel="weather"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4 4 0 1 1 1-8 5 5 0 0 1 9 3 3 3 0 0 1 0 6H7zM12 2v2M3 5l2 2M1 11h2"/></svg>週間天気</button>
  <button id="tab-tide" class="tab" role="tab" aria-selected="false" aria-controls="panel-tide" tabindex="-1" data-panel="tide"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7c3-4 5 4 8 0s5 4 8 0 4 0 4 0M2 12c3-4 5 4 8 0s5 4 8 0 4 0 4 0M2 17c3-4 5 4 8 0s5 4 8 0 4 0 4 0"/></svg>潮汐</button>
</div>
</div>
<div id="progress" role="status" aria-live="polite" style="display:none;"></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div class="content">
  <div id="panel-news" class="active" role="tabpanel" aria-labelledby="tab-news">
    <div class="panel-intro"><div class="eyebrow">NEWS</div><h2>ニュースを読む</h2><p>気になる記事を開いて、じっくり読む。</p></div>
    <div id="news-tools"></div>
    <div id="news-state" class="data-state" role="status" aria-live="polite"></div>
    <div id="news-list">
      <div class="empty">データなし — 更新ボタンを押してください</div>
    </div>
  </div>
  <div id="panel-weather" role="tabpanel" aria-labelledby="tab-weather" hidden>
    <div class="panel-intro"><div class="eyebrow">WEATHER</div><h2>空模様を確かめる</h2><p>現在地や地域を選んで、今日から一週間の予報を。</p></div>
    <div id="weather-state" class="data-state" role="status" aria-live="polite"></div>
    <div id="geo-weather"></div>
    <div id="jma-weather">
      <div class="empty">データなし — 更新ボタンを押してください</div>
    </div>
  </div>
  <div id="panel-tide" role="tabpanel" aria-labelledby="tab-tide" hidden>
    <div class="panel-intro"><div class="eyebrow">TIDE</div><h2>海の動きを知る</h2><p>観測点を選んで、満潮・干潮と時間ごとの潮位を。</p></div>
    <div id="tide-page">

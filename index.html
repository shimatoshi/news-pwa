<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ニュース & 天気</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<script>
// 描画前に設定を適用し、起動時の白い画面を抑える。
try {
  const saved = localStorage.getItem('news-theme');
  document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
    ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
} catch (_) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">本文へスキップ</a>
<div class="app-chrome">
<header>
  <div class="brand"><h1>ニュース &amp; 天気</h1><div class="status" id="status">確認中...</div></div>
  <div class="header-actions">
    <button class="btn-refresh" id="btn-refresh" title="更新" aria-label="ニュースと天気を更新"><span class="refresh-icon" aria-hidden="true">↻</span><span>更新</span></button>
    <details class="settings-menu" id="settings-menu"><summary>設定</summary><div class="settings-content">
      <div class="theme-setting"><span>表示モード</span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="ダークモード切り替え" aria-pressed="false">☾</button></div>
      <div id="news-tools"></div>
    </div></details>
  </div>
</header>
<div class="tabs" role="tablist" aria-label="表示する情報">
  <button id="tab-news" class="tab active" role="tab" aria-selected="true" aria-controls="panel-news" data-panel="news"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h3M8 18h8"/></svg>ニュース</button>
  <button id="tab-weather" class="tab" role="tab" aria-selected="false" aria-controls="panel-weather" tabindex="-1" data-panel="weather"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4 4 0 1 1 1-8 5 5 0 0 1 9 3 3 3 0 0 1 0 6H7zM12 2v2M3 5l2 2M1 11h2"/></svg>天気</button>
  <button id="tab-tide" class="tab" role="tab" aria-selected="false" aria-controls="panel-tide" tabindex="-1" data-panel="tide"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7c3-4 5 4 8 0s5 4 8 0 4 0 4 0M2 12c3-4 5 4 8 0s5 4 8 0 4 0 4 0M2 17c3-4 5 4 8 0s5 4 8 0 4 0 4 0"/></svg>潮汐</button>
</div>
</div>
<div id="progress" role="status" aria-live="polite" style="display:none;"></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<main class="content" id="main-content" tabindex="-1">
  <div id="panel-news" class="active" role="tabpanel" aria-labelledby="tab-news">
    <div id="news-filters" role="group" aria-label="ニュースのカテゴリ"></div>
    <details class="search-box"><summary>記事を検索</summary><label class="news-search"><span class="sr-only">記事を検索</span><input id="news-search" type="search" placeholder="見出し・配信元で検索" autocomplete="off"></label></details>
    <p id="news-summary" class="news-summary" role="status" aria-live="polite"></p>
    <div id="news-state" class="data-state" role="status" aria-live="polite"></div>
    <div id="news-list">
      <div class="empty">データを読み込んでいます…</div>
    </div>
  </div>
  <div id="panel-weather" role="tabpanel" aria-labelledby="tab-weather" hidden>
    <h2 class="section-heading">天気予報</h2>
    <div id="weather-state" class="data-state" role="status" aria-live="polite"></div>
    <div id="geo-weather"></div>
    <div id="jma-weather">
      <div class="empty">データを読み込んでいます…</div>
    </div>
  </div>
  <div id="panel-tide" role="tabpanel" aria-labelledby="tab-tide" hidden>
    <h2 class="section-heading">潮汐</h2>
    <div id="tide-page">
      <div id="tide-detail">
        <div class="tide-empty">現在地、または下の一覧から観測点を選ぶと潮汐を表示します
          <div><button class="geo-btn" onclick="loadTidePage(true)">現在地の潮汐を表示</button></div>
        </div>
      </div>
      <div id="tide-browser"></div>
    </div>
  </div>
</main>

<div id="reader" class="reader" role="dialog" aria-modal="true" aria-labelledby="reader-heading" hidden inert>
  <div class="reader-bar">
    <button class="reader-back" onclick="closeReader()">‹ 戻る</button>
  </div>
  <div class="reader-content"></div>
</div>

<script>
(() => {
  const root = document.documentElement;
  const button = document.getElementById('theme-toggle');
  const media = matchMedia('(prefers-color-scheme: dark)');
  const apply = theme => {
    root.dataset.theme = theme;
    const dark = theme === 'dark';
    button.textContent = dark ? '☀' : '☾';
    button.setAttribute('aria-pressed', String(dark));
    button.setAttribute('aria-label', dark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
    button.title = button.getAttribute('aria-label');
    document.querySelector('meta[name="theme-color"]').content = dark ? '#17191d' : '#2563eb';
  };
  apply(root.dataset.theme || 'light');
  button.addEventListener('click', () => {
    const theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    apply(theme);
    try { localStorage.setItem('news-theme', theme); } catch (_) {}
  });
  media.addEventListener('change', event => {
    try { if (localStorage.getItem('news-theme')) return; } catch (_) {}
    apply(event.matches ? 'dark' : 'light');
  });
  window.addEventListener('storage', event => {
    if (event.key === 'news-theme') apply(event.newValue === 'dark' || event.newValue === 'light'
      ? event.newValue : (media.matches ? 'dark' : 'light'));
  });
})();
</script>
<script src="readability.js"></script>
<script src="app.js"></script>
<script src="debug-note.js" data-app="news-pwa"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ニュース & 天気</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a2620">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  background: #14120d;
  color: #e6e0d4;
  min-height: 100vh;
  padding-bottom: 80px;
}
header {
  background: linear-gradient(135deg, #2a2620, #211d17);
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
header h1 {
  font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em;
  font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
}
.status {
  font-size: 0.7rem;
  margin-top: 3px;
  opacity: 0.7;
}
.status.online::before { content: '● '; color: #4caf50; }
.status.offline::before { content: '● '; color: #ff9800; }

/* タブ */
.tabs {
  display: flex;
  background: #1d1a14;
  position: sticky;
  top: 53px;
  z-index: 99;
}
.tab {
  flex: 1;
  padding: 11px 8px;
  text-align: center;
  cursor: pointer;
  border: none;
  background: transparent;
  color: #666;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s;
  border-bottom: 3px solid transparent;
}
.tab.active { color: #fff; border-bottom-color: #d99a3f; }

/* コンテンツ */
.content { padding: 12px; }
#panel-news, #panel-weather { display: none; }
#panel-news.active, #panel-weather.active { display: block; }

/* ニュース */
.news-category {
  margin-bottom: 20px;
}
.cat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding: 6px 10px;
  background: linear-gradient(90deg, #2a251d, transparent);
  border-left: 3px solid #d99a3f;
  border-radius: 0 6px 6px 0;
}
.cat-header h2 {
  font-size: 0.85rem;
  font-weight: 700;
  color: #d99a3f;
}
.cat-header .count {
  font-size: 0.65rem;
  color: #666;
  background: #14120d;
  padding: 2px 6px;
  border-radius: 8px;
}
.news-item {
  margin-bottom: 6px;
  background: #221f18;
  border-radius: 8px;
  border-left: 2px solid transparent;
  transition: border-color 0.2s;
}
.news-item.open { border-left-color: #d99a3f; }
.news-header {
  padding: 10px 12px;
  cursor: pointer;
}
.news-item h3 {
  font-size: 0.85rem;
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 4px;
}
.news-item .meta {
  font-size: 0.65rem;
  color: #666;
}
.news-body {
  display: none;
  padding: 0 12px 12px;
}
.news-item.open .news-body { display: block; }
.news-body p {
  font-size: 0.8rem;
  color: #bbb;
  line-height: 1.7;
  margin-bottom: 8px;
}
.read-more {
  display: inline-block;
  font-size: 0.75rem;
  color: #d99a3f;
  text-decoration: none;
  padding: 4px 0;
}
.offline-badge { margin-left: 6px; font-size: 0.7rem; }

/* アプリ内リーダー */
.reader {
  position: fixed;
  inset: 0;
  background: #14120d;
  z-index: 200;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.reader.open { transform: translateX(0); }
.reader-bar {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg, #2a2620, #211d17);
  padding: 12px 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.reader-back {
  background: transparent;
  border: none;
  color: #d99a3f;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 0;
}
.reader-content { padding: 16px 18px 60px; max-width: 720px; margin: 0 auto; }
.reader-title {
  font-size: 1.2rem; font-weight: 700; line-height: 1.55; margin-bottom: 8px;
  font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
}
.reader-meta { font-size: 0.7rem; color: #777; margin-bottom: 16px; }
.reader-text p {
  font-size: 0.95rem;
  line-height: 1.9;
  color: #ddd;
  margin-bottom: 14px;
}
.reader-text .reader-note {
  font-size: 0.78rem;
  color: #ff9800;
  background: #211d17;
  padding: 8px 10px;
  border-radius: 6px;
}

/* 現在地ピンポイント天気 */
.geo-card {
  background: linear-gradient(135deg, #242019, #2a2620);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  border: 1px solid #3a342a;
}
.geo-empty {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #aaa;
  font-size: 0.85rem;
}
.geo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.geo-name { font-size: 0.9rem; font-weight: 700; color: #7fb5ff; }
.geo-refresh, .geo-btn {
  background: rgba(217,154,63,0.15);
  border: 1px solid #d99a3f;
  color: #d99a3f;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
}
.geo-refresh { width: 30px; height: 30px; border-radius: 50%; }
.geo-btn { padding: 6px 12px; font-weight: 600; }
.geo-now { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.geo-icon { font-size: 2.6rem; }
.geo-temp { font-size: 2.4rem; font-weight: 700; }
.geo-detail { font-size: 0.75rem; color: #bbb; line-height: 1.7; }
.geo-detail div:first-child { font-size: 0.95rem; color: #fff; }
.geo-updated { font-size: 0.6rem; color: #555; text-align: right; margin-top: 6px; }
.hourly-mm { font-size: 0.55rem; color: #4fc3f7; margin-top: 1px; min-height: 0.7em; }
.hourly-temp { font-size: 0.55rem; color: #ff8a65; margin-top: 1px; }

/* 天気 - 地方 */
.weather-area {
  margin-bottom: 8px;
  background: #221f18;
  border-radius: 10px;
  overflow: hidden;
}
.area-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  background: linear-gradient(135deg, #242019, #2a251d);
  cursor: pointer;
}
.area-header h3 { font-size: 0.9rem; font-weight: 700; flex: 1; }
.area-arrow { font-size: 0.6rem; color: #666; transition: transform 0.2s; }
.weather-area.open .area-arrow { transform: rotate(90deg); }
.area-count { font-size: 0.65rem; color: #666; background: #14120d; padding: 2px 6px; border-radius: 8px; }
.area-body { display: none; padding: 4px 8px 8px; }
.weather-area.open .area-body { display: block; }

/* 天気 - 都道府県 */
.weather-pref {
  margin-bottom: 4px;
  background: #1b1812;
  border-radius: 8px;
  overflow: hidden;
}
.pref-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 0.8rem;
}
.pref-summary { font-size: 0.75rem; color: #aaa; }
.pref-body { display: none; padding: 0 10px 10px; }
.weather-pref.open .pref-body { display: block; }

/* 細分区域（北西部/南部 等） */
.sub-area {
  background: #201c15;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-left: 2px solid #3a342a;
}
.sub-name {
  font-size: 0.78rem;
  font-weight: 700;
  color: #7fb5ff;
  margin-bottom: 4px;
}

/* 今日明日 */
.today-weather { margin-bottom: 6px; }
.today-item { font-size: 0.75rem; padding: 3px 0; color: #ccc; line-height: 1.5; }
.today-label { color: #888; margin-right: 4px; }

/* 気温（観測点） */
.temp-points { margin: 8px 0; }
.temp-row { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.temp-pt { font-size: 0.72rem; color: #ccc; }
.temp-pt .pt-name { color: #888; margin-right: 2px; }
.temp-pt .hi { color: #ff8a65; }
.temp-pt .lo { color: #64b5f6; }
.week-area-name { font-size: 0.7rem; color: #888; margin: 8px 0 4px; }

/* 警報・注意報 */
.warn-headline {
  font-size: 0.78rem; font-weight: 700; line-height: 1.4;
  padding: 8px 10px; margin: 0 0 10px; border-radius: 8px;
  border-left: 4px solid;
}
.warn-badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
.warn-badge {
  font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 10px;
  white-space: nowrap;
}
.warn-special { background: #5a1414; color: #ff5252; border-color: #ff1744; }
.warn-warning { background: #4a2c0a; color: #ffab40; border-color: #ff9100; }
.warn-advisory { background: #3a3410; color: #ffeb3b; border-color: #ffd600; }

/* 潮汐 */
.tide-card { margin: 10px 0; padding: 10px; background: #2a2620; border-radius: 10px; }
.tide-head { font-size: 0.82rem; font-weight: 700; color: #4fc3f7; margin-bottom: 8px; }
.tide-stn { font-size: 0.72rem; color: #9fb8d8; font-weight: 400; margin-left: 4px; }
.tide-rows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.tide-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tide-k { font-size: 0.68rem; font-weight: 700; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
.tide-k.high { background: #0d3b66; color: #7fb5ff; }
.tide-k.low { background: #3a2a0d; color: #ffc176; }
.tide-ev { font-size: 0.74rem; color: #ddd; }
.tide-ev b { color: #fff; }
.tide-ev.tide-none { color: #666; }
.tide-spark { display: flex; align-items: flex-end; gap: 1px; height: 40px; }
.tide-bar { flex: 1; background: #2e6da4; border-radius: 1px 1px 0 0; min-height: 2px; }
.tide-bar.now { background: #d99a3f; }

/* 予報地点ごとの週間予報 */
.point-week { margin: 10px 0; }
.point-name {
  font-size: 0.8rem;
  font-weight: 700;
  color: #7fb5ff;
  margin-bottom: 5px;
}
.point-now { font-size: 0.7rem; font-weight: 400; color: #aaa; margin-left: 4px; }
.point-noweek { font-size: 0.7rem; color: #666; padding: 4px 0; }

/* 6時間毎降水確率 */
.hourly-pops { margin: 8px 0; }
.hourly-label { font-size: 0.65rem; color: #888; margin-bottom: 4px; }
.hourly-bar { display: flex; gap: 3px; align-items: flex-end; height: 62px; }
.hourly-cell { flex: 1; display: flex; flex-direction: column; align-items: center; }
.hourly-time { font-size: 0.55rem; color: #666; margin-bottom: 2px; order: -1; }
.hourly-gauge { width: 100%; border-radius: 2px 2px 0 0; min-height: 2px; }
.hourly-val { font-size: 0.6rem; color: #aaa; margin-top: 2px; }
.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 6px;
}
.day-card {
  background: #1b1812;
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
}
.day-card .day-name {
  font-size: 0.7rem;
  color: #888;
  margin-bottom: 4px;
}
.day-card .day-name.sat { color: #42a5f5; }
.day-card .day-name.sun { color: #ef5350; }
.day-card .weather-icon {
  font-size: 1.4rem;
  margin: 4px 0;
}
.day-card .weather-text {
  font-size: 0.6rem;
  color: #aaa;
  margin-bottom: 4px;
}
.day-card .temp {
  font-size: 0.7rem;
}
.day-card .temp .hi { color: #ff8a65; }
.day-card .temp .lo { color: #64b5f6; }
.day-card .pop {
  font-size: 0.6rem;
  color: #4fc3f7;
  margin-top: 2px;
}

/* 更新ボタン */
.btn-refresh {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #d99a3f, #b9832f);
  color: white;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(217,154,63,0.4);
  z-index: 100;
}
.btn-refresh:active { transform: scale(0.9); }
.btn-refresh.loading { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#progress {
  background: #211d17;
  color: #4fc3f7;
  font-size: 0.75rem;
  padding: 8px 16px;
  text-align: center;
}
.empty {
  text-align: center;
  padding: 40px 20px;
  color: #6b6355;
  font-size: 0.85rem;
}

/* ニュースのサムネイル画像 */
.news-header { display: flex; gap: 10px; align-items: flex-start; }
.news-header .news-main { flex: 1; min-width: 0; }
.news-thumb {
  width: 74px; height: 74px; object-fit: cover; border-radius: 6px;
  flex-shrink: 0; background: #201c15;
}
.reader-hero {
  width: 100%; max-height: 230px; object-fit: cover;
  border-radius: 8px; margin-bottom: 14px; background: #201c15;
}

/* カスタムフィード（任意サイト）ツールバー */
.news-tools { margin-bottom: 14px; }
.news-tools-row { display: flex; gap: 8px; align-items: center; }
.add-site-btn {
  background: rgba(217,154,63,0.15); border: 1px solid #d99a3f; color: #d99a3f;
  border-radius: 8px; padding: 7px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
}
.feed-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.feed-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: #221f18; border: 1px solid #3a342a; border-radius: 14px;
  padding: 4px 6px 4px 11px; font-size: 0.72rem; color: #cfc7b7;
}
.feed-chip .feed-del {
  cursor: pointer; color: #a89f8c; background: #2b2723; border-radius: 50%;
  width: 18px; height: 18px; line-height: 18px; text-align: center; font-size: 0.7rem;
}
.feed-chip.custom-cat .feed-del:hover { color: #e8724c; }
.site-form {
  margin-top: 8px; background: #201c15; border: 1px solid #3a342a;
  border-radius: 8px; padding: 10px; display: none;
}
.site-form.open { display: block; }
.site-form input {
  width: 100%; box-sizing: border-box; background: #14120d; color: #e6e0d4;
  border: 1px solid #3a342a; border-radius: 6px; padding: 8px 10px; font-size: 0.82rem;
  margin-bottom: 8px;
}
.site-form .site-form-row { display: flex; gap: 8px; }
.site-form button {
  border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.8rem;
  font-weight: 600; cursor: pointer;
}
.site-form .sf-add { background: #d99a3f; color: #1b1812; }
.site-form .sf-cancel { background: #2b2723; color: #cfc7b7; }
.site-form .sf-hint { font-size: 0.68rem; color: #8a8272; margin-bottom: 8px; line-height: 1.5; }
.cat-header.custom h2 { color: #e0b56a; }

/* 潮汐ページ（独立タブ） */
#panel-tide { display: none; }
#panel-tide.active { display: block; }
.tide-empty { text-align: center; padding: 40px 20px; color: #6b6355; font-size: 0.85rem; }
.tide-empty .geo-btn { margin-top: 14px; }
.tide-day { margin-bottom: 14px; }
.tide-day-head {
  font-size: 0.82rem; font-weight: 700; color: #d99a3f;
  padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid #3a342a;
}
.tide-day-head .tide-day-dow { color: #8a8272; font-weight: 400; margin-left: 6px; }
.tide-page-stn { font-size: 0.78rem; color: #cfc7b7; margin-bottom: 12px; }
.tide-page-stn b { color: #7fb5ff; }
#tide-detail { margin-bottom: 16px; }

/* 全国の観測点ブラウザ */
.tide-browser-head {
  font-size: 0.78rem; font-weight: 700; color: #8a8272;
  margin: 6px 2px 8px; padding-top: 12px; border-top: 1px solid #2b2723;
}
.tide-region { margin-bottom: 8px; }
.tide-stn-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 6px; padding: 4px 2px;
}
.tide-stn-btn {
  background: #201c15; border: 1px solid #3a342a; color: #d8d0c0;
  border-radius: 6px; padding: 8px 4px; font-size: 0.74rem; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tide-stn-btn:active { background: #2b2723; border-color: #d99a3f; }
</style>
</head>
<body>
<header>
  <h1>ニュース & 天気</h1>
  <div class="status" id="status">確認中...</div>
</header>
<div class="tabs">
  <button class="tab active" data-panel="news">ニュース</button>
  <button class="tab" data-panel="weather">週間天気</button>
  <button class="tab" data-panel="tide">潮汐</button>
</div>
<div id="progress" style="display:none;"></div>
<div class="content">
  <div id="panel-news" class="active">
    <div id="news-tools"></div>
    <div id="news-list">
      <div class="empty">データなし — 更新ボタンを押してください</div>
    </div>
  </div>
  <div id="panel-weather">
    <div id="geo-weather"></div>
    <div id="jma-weather">
      <div class="empty">データなし — 更新ボタンを押してください</div>
    </div>
  </div>
  <div id="panel-tide">
    <div id="tide-page">
      <div id="tide-detail">
        <div class="tide-empty">現在地、または下の一覧から観測点を選ぶと潮汐を表示します
          <div><button class="geo-btn" onclick="loadTidePage(true)">現在地の潮汐を表示</button></div>
        </div>
      </div>
      <div id="tide-browser"></div>
    </div>
  </div>
</div>
<button class="btn-refresh" id="btn-refresh" title="更新">↻</button>

<div id="reader" class="reader">
  <div class="reader-bar">
    <button class="reader-back" onclick="closeReader()">‹ 戻る</button>
  </div>
  <div class="reader-content"></div>
</div>

<script src="readability.js"></script>
<script src="app.js"></script>
<script src="debug-note.js" data-app="news-pwa"></script>
</body>
</html>

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shimatoshi.tidewidget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shimatoshi.tidewidget'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // 更新インストールできるよう、署名は固定のデバッグ用keystoreを使う（秘匿情報ではない）
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
